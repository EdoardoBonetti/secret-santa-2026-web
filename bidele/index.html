<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secret Santa Bidele</title>
  <style>
    :root {
      --red: #e23b4e;
      --red-deep: #b11f33;
      --green: #1f9d57;
      --gold: #f3c969;
      --ink: #0e1726;
      --card: rgba(255, 255, 255, 0.10);
      --card-border: rgba(255, 255, 255, 0.22);
      --text: #f4f7fb;
      --muted: #aab6c6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -5%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 90% 10%, #3a1230 0%, transparent 55%),
        linear-gradient(160deg, #0b1220 0%, #0e1a2b 55%, #10151f 100%);
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden;
    }

    /* Falling snow */
    .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .snow i {
      position: absolute; top: -8vh; color: #fff; opacity: .8;
      animation: fall linear infinite;
      text-shadow: 0 0 6px rgba(255,255,255,.4);
    }
    @keyframes fall {
      0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
      100% { transform: translateY(110vh) translateX(6vw) rotate(360deg); }
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 430px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 30px 34px;
      text-align: center;
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.15);
      animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .badge {
      font-size: 2.6rem; line-height: 1;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.4));
      animation: bob 3.5s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }

    h1 {
      font-size: 1.7rem; margin: 12px 0 2px; letter-spacing: .3px;
      font-weight: 800;
    }
    h1 .year {
      display: block; font-size: .9rem; letter-spacing: .5em; font-weight: 600;
      margin-top: 6px; color: var(--gold); padding-left: .5em;
    }
    p.sub { color: var(--muted); margin: 14px 0 24px; font-size: .95rem; }

    form { display: grid; gap: 12px; }
    input[type="text"] {
      width: 100%; padding: 16px; font-size: 1.5rem; font-weight: 700;
      letter-spacing: .35em; text-align: center; text-transform: uppercase;
      color: var(--text); background: rgba(0,0,0,.28);
      border: 2px solid rgba(255,255,255,.18); border-radius: 14px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,.3); letter-spacing: .35em; }
    input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(243,201,105,.18); }

    button {
      width: 100%; padding: 15px 16px; font-size: 1.05rem; font-weight: 700;
      color: #fff; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
      box-shadow: 0 10px 24px rgba(177,31,51,.4); transition: transform .12s, box-shadow .2s, opacity .2s;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .6; cursor: default; transform: none; }

    .error { color: #ffb3bd; min-height: 1.2em; margin-top: 14px; font-size: .95rem; font-weight: 600; }
    .hidden { display: none; }

    .greeting { font-size: 1.15rem; margin: 10px 0 6px; }
    .greeting b { color: var(--gold); }
    .reveal-btn { background: linear-gradient(180deg, var(--green) 0%, #157a41 100%);
      box-shadow: 0 10px 24px rgba(21,122,65,.4); margin-top: 8px; }

    .name-wrap { min-height: 3.4rem; display: flex; align-items: center; justify-content: center; margin: 22px 0 4px; }
    .name {
      font-size: 2.6rem; font-weight: 900; letter-spacing: .5px;
      background: linear-gradient(90deg, #7ef0a9, var(--gold)); -webkit-background-clip: text;
      background-clip: text; color: transparent;
      opacity: 0; transform: scale(.94); transition: opacity .5s ease, transform .5s ease;
    }
    .name.show { opacity: 1; transform: scale(1); }

    .particle {
      position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
      will-change: transform, opacity; user-select: none;
    }
    .name.pop { animation: namepop .5s cubic-bezier(.2,1.4,.4,1); }
    @keyframes namepop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .secret {
      margin-top: 18px; font-weight: 800; font-size: 1.05rem; letter-spacing: .04em;
      color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.4);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .secret .shh { font-size: 1.3rem; }
    @keyframes pulse { 50% { transform: scale(1.05); opacity: .85; } }
    .logout { display: inline-block; margin-top: 20px; color: var(--muted);
      font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .logout:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <div class="card">
    <!-- View 1: login -->
    <section id="login">
      <div class="badge">🎁</div>
      <h1>Secret Santa<span class="year">Bidele</span></h1>
      <p class="sub">Inserisci il tuo codice personale per scoprire a chi fai il regalo.</p>
      <form id="loginForm" autocomplete="off">
        <input id="codeInput" type="text" inputmode="latin" maxlength="6"
               placeholder="••••••" aria-label="Il tuo codice" autocapitalize="characters" spellcheck="false" />
        <button type="submit" id="enterBtn">Apri ✨</button>
      </form>
      <div class="error" id="error"></div>
    </section>

    <!-- View 2: result -->
    <section id="result" class="hidden">
      <div class="badge">🎅</div>
      <p class="greeting" id="greeting"></p>
      <button type="button" class="reveal-btn" id="revealBtn">Clicca qui per il nome</button>
      <div class="name-wrap"><div class="name" id="name"></div></div>
      <div class="secret"><span class="shh">🤫</span> NON DIRLO A NESSUNO!!!</div>
      <span class="logout" id="logout">Esci</span>
    </section>
  </div>

  <script>
    // --- Falling snow (decorative) -------------------------------------------
    (function () {
      const snow = document.getElementById('snow');
      const snowChars = ['❄', '❅', '❆', '•'];
      // Classic yellow-oval Batman emblem image.
      const batSvg = (sizeRem) =>
        `<img src="assets/batman.png" alt="" style="width:${sizeRem}rem;height:auto;display:block;` +
        `filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))">`;
      const N = 46;
      let html = '';
      for (let i = 0; i < N; i++) {
        const left = Math.random() * 100;
        const dur = 6 + Math.random() * 9;
        const delay = -Math.random() * 12;
        // ~12% Batman emblem, then ~30% of the rest are T-Rexes 🦖, else snow.
        const roll = Math.random();
        const isBat = roll < 0.12;
        const isDino = !isBat && roll < 0.12 + 0.26;
        let content, size, op;
        if (isBat) {
          size = 1.8 + Math.random() * 1.8;
          op = 0.75 + Math.random() * 0.25;
          content = batSvg(size);
        } else if (isDino) {
          size = 2.2 + Math.random() * 1.8;
          op = 0.6 + Math.random() * 0.35;
          content = '🦖';
        } else {
          size = 1.1 + Math.random() * 1.7;
          op = 0.35 + Math.random() * 0.5;
          content = snowChars[(Math.random() * snowChars.length) | 0];
        }
        const fs = isBat ? '' : `font-size:${size}rem;`;
        html += `<i style="left:${left}vw;${fs}opacity:${op};` +
                `animation-duration:${dur}s;animation-delay:${delay}s">${content}</i>`;
      }
      snow.innerHTML = html;
    })();
  </script>

  <script src="assignments.js"></script>
  <script>
    const A = window.ASSIGNMENTS;
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const b64ToBytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const salt = A ? b64ToBytes(A.salt) : null;
    const el = (id) => document.getElementById(id);

    async function deriveKey(code) {
      const baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: A.kdf.name, salt, iterations: A.kdf.iterations, hash: A.kdf.hash },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }

    // Try every entry; AES-GCM's auth tag means only the right one decrypts.
    async function resolve(code) {
      const key = await deriveKey(code);
      for (const entry of A.entries) {
        try {
          const pt = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: b64ToBytes(entry.iv) }, key, b64ToBytes(entry.ct));
          return JSON.parse(dec.decode(pt));
        } catch (_) { /* wrong entry for this code */ }
      }
      return null;
    }

    function showResult(giver, receiver) {
      el('greeting').innerHTML = `Ciao <b>${giver}</b>! Fai un regalo a:`;
      el('name').textContent = receiver;
      el('login').classList.add('hidden');
      el('result').classList.remove('hidden');
    }
    function showLogin() {
      el('result').classList.add('hidden');
      el('login').classList.remove('hidden');
      el('codeInput').value = '';
      el('name').textContent = '';
      el('error').textContent = '';
      el('codeInput').focus();
    }

    el('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = el('codeInput').value.trim().toUpperCase();
      el('error').textContent = '';
      if (!code) return;
      if (!A) { el('error').textContent = 'Dati non ancora caricati'; return; }
      el('enterBtn').disabled = true;
      try {
        const found = await resolve(code);
        if (found) showResult(found.g, found.r);
        else el('error').textContent = 'Codice non valido, riprova';
      } catch (_) {
        el('error').textContent = 'Qualcosa è andato storto, riprova';
      } finally {
        el('enterBtn').disabled = false;
      }
    });

    const EMOJIS = ['💥', '💖', '🌸', '🎉', '✨', '🌼', '💘', '🎁', '🦖', '🥳', '💗', '🌺'];

    // Fun emoji explosion fired from a screen point (cx, cy).
    function explodeAt(cx, cy, N = 22) {
      const emojis = EMOJIS;
      for (let i = 0; i < N; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = emojis[(Math.random() * emojis.length) | 0];
        p.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        p.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
        document.body.appendChild(p);
        const angle = Math.random() * Math.PI * 2;
        const dist = 90 + Math.random() * 230;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 40; // slight upward bias
        const rot = (Math.random() * 2 - 1) * 540;
        p.animate([
          { transform: `translate(${cx}px, ${cy}px) translate(-50%,-50%) scale(.3) rotate(0deg)`, opacity: 1 },
          { transform: `translate(${cx + dx}px, ${cy + dy}px) translate(-50%,-50%) scale(${1 + Math.random()}) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.15,.7,.3,1)' })
         .addEventListener('finish', () => p.remove());
      }
    }

    // Reveal: fade in, hold 5s, fade out; ignore clicks while visible.
    let revealing = false;
    el('revealBtn').addEventListener('click', () => {
      if (revealing) return;
      revealing = true;
      const name = el('name');
      name.classList.add('show');
      name.classList.remove('pop'); void name.offsetWidth; name.classList.add('pop');
      const r = name.getBoundingClientRect();
      explodeAt(r.left + r.width / 2, r.top + r.height / 2, 34);
      setTimeout(() => {
        name.classList.remove('show');
        setTimeout(() => { revealing = false; }, 500);
      }, 5000);
    });

    el('logout').addEventListener('click', showLogin);

    // Every click anywhere bursts a few emoji at the cursor.
    document.addEventListener('click', (e) => explodeAt(e.clientX, e.clientY));
    // Touch taps too (mobile).
    document.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (t) explodeAt(t.clientX, t.clientY);
    }, { passive: true });

    el('codeInput').focus();
  </script>
</body>
</html>
